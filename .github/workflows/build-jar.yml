name: Build and commit JAR

on:
  push:
    branches: [main, fast-peripheral-lane]
    paths-ignore:
      - 'build/libs/**'
      - 'build-action.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve mod version
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          test -n "$MOD_VERSION"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "MOD_JAR=build/libs/sable-cc-tick-sync-$MOD_VERSION.jar" >> "$GITHUB_ENV"

      - name: Download Sable 2.0.5
        id: sable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../_deps_sable_2_0_5 ../_deps_sable
          {
            python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              'game_versions': json.dumps(['1.21.1']),
              'loaders': json.dumps(['neoforge']),
          })
          url = 'https://api.modrinth.com/v2/project/sable/version?' + params
          req = urllib.request.Request(url, headers={'User-Agent': 'Sable-CC-Tick-Sync-GitHub-Actions/1.2'})
          with urllib.request.urlopen(req) as response:
              versions = json.load(response)

          print('Available Sable NeoForge 1.21.1 versions:')
          for item in versions:
              print(' -', item.get('version_number'))

          version = next(
              (v for v in versions if str(v.get('version_number', '')).startswith('2.0.5')),
              None,
          )
          if version is None:
              raise SystemExit('Sable 2.0.5 for NeoForge 1.21.1 was not found on Modrinth')

          files = version.get('files') or []
          primary = next((f for f in files if f.get('primary')), files[0] if files else None)
          if primary is None:
              raise SystemExit('Sable 2.0.5 has no downloadable files')

          print('Selected version:', version.get('version_number'))
          print('Selected file:', primary.get('filename'))
          print('Downloading:', primary['url'])
          urllib.request.urlretrieve(
              primary['url'],
              '../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar',
          )
          PY
          } 2>&1 | tee build-action.log

      - name: Extract Sable Companion dependency
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Extract Sable Companion ==='
            jar tf ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar | grep 'sable-companion-common' || true
            cd ../_deps_sable
            jar xf ../_deps_sable_2_0_5/sable-neoforge-1.21.1-2.0.5.jar META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar
            test -f META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/build-action.log"

      - name: Build mod
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          {
            echo '=== Java ==='
            java -version
            echo '=== Gradle ==='
            ./gradlew --version
            echo '=== Build ==='
            ./gradlew --no-daemon clean build
          } 2>&1 | tee -a build-action.log

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MOD_JAR"
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/SableCcTickSync.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/SableSyncApi.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/HighFrequencyController.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/FastPeripheralCallContext.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/FastPeripheralScheduler.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/mixin/LuaContextMixin.class'
          jar tf "$MOD_JAR" | grep -q 'ua/ivan/sableccticksync/mixin/PeripheralWrapperMixin.class'
          jar tf "$MOD_JAR" | grep -q 'META-INF/neoforge.mods.toml'
          echo 'JAR verification passed.' | tee -a build-action.log

      - name: Commit built JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$MOD_JAR"
          if git diff --cached --quiet; then
            echo 'Built JAR is already up to date.'
          else
            git commit -m "Build Sable CC Tick Sync $MOD_VERSION for Sable 2.0.5"
            git push
          fi

      - name: Commit build log
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f build-action.log ]; then
            {
              echo 'Build did not create a build log.'
              echo "sable-step=${{ steps.sable.outcome }}"
              echo "gradle-step=${{ steps.gradle_build.outcome }}"
            } > build-action.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add -f build-action.log
          git commit -m 'Record Sable CC Tick Sync build result' || exit 0
          git push
